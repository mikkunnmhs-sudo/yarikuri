<style>

*{box-sizing:border-box}

.lt{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 4px 4px}
.date{font-size:13px;font-weight:600;color:var(--sub)}

.acts{display:flex;gap:10px;padding-bottom:4px}

.tip{font-size:17px;font-weight:600;line-height:1.5}

.line{position:absolute;top:0;bottom:0;width:2px;background:var(--text)}
.順調{color:var(--green)}.注意{color:var(--orange)}.ピンチ{color:var(--red)}
.bg順調{background:var(--green)}.bg注意{background:var(--orange)}.bgピンチ{background:var(--red)}
.s順調{stroke:var(--green)}.s注意{stroke:var(--orange)}.sピンチ{stroke:var(--red)}
.note{font-size:13px;color:var(--sub);margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep)}

.top{display:flex;justify-content:space-between;gap:8px;font-size:15px}

.group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:11px 16px;min-height:44px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.list .row{padding-left:0;padding-right:0}
.list .row+.row::before{left:0}
.ins .row{align-items:flex-start}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.tap{cursor:pointer;transition:background .15s}
.tap:active{background:var(--fill)}
.rt{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt2{font-size:15px;font-weight:600}
.amt{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--sub);opacity:.6;font-size:22px;line-height:1}

.b2{color:var(--purple);background:rgba(175,82,222,.15)}
.st{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.st-ok{background:var(--green)}.st-soon{background:var(--blue)}.st-hold{background:var(--purple)}.st-wait{background:var(--orange)}.st-none{background:var(--sub)}

.txtbtn{font-size:16px;padding:8px 0}
.danger{color:var(--red)}
.primary{display:block;width:100%;background:var(--blue);color:#fff;font-size:17px;font-weight:600;border-radius:12px;padding:14px;margin:10px 0 4px}
.ghost{display:block;width:100%;background:rgba(0,122,255,.12);color:var(--blue);border-radius:12px;padding:12px;font-size:15px;font-weight:600;margin-top:8px;text-align:left}
.aibtns{display:grid;gap:8px}
.aibtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--fill);border-radius:12px;padding:12px;color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
.aibtn:active{opacity:.6}
input,select{font:inherit;font-size:17px;color:var(--text);background:transparent;border:none;outline:none;-webkit-appearance:none;appearance:none}
.fin{flex:1;text-align:right;min-width:0}
.bin{width:100px;text-align:right;background:var(--fill);border-radius:8px;padding:6px 8px;font-size:16px;flex:none}
.lk{width:84px;flex:none}
.row select{color:var(--sub);text-align-last:right;flex:1;text-align:right}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:10px 0 0}
.chk input,.cb{-webkit-appearance:checkbox;appearance:auto;width:20px;height:20px;margin-top:2px;flex:none}
.segc{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:10px}
.segc button{flex:1;padding:7px 4px;border-radius:7px;font-size:14px;font-weight:600;color:var(--text)}
.segc button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.verdict{display:inline-block;color:#fff;font-weight:700;font-size:17px;padding:6px 16px;border-radius:999px;margin:14px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;background:rgba(0,122,255,.12)}
.askrow{display:flex;gap:8px;align-items:center;background:var(--fill);border-radius:12px;padding:6px 6px 6px 12px}
.askrow input{flex:1;min-width:0;font-size:16px}
.askbtn{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-size:18px;font-weight:700;flex:none}
.q{margin:10px 0 0 auto;max-width:85%;width:fit-content;background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px;padding:8px 12px;font-size:15px}

.rep{border-top:.5px solid var(--sep);padding:10px 0}

.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 4px);background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid var(--sep);z-index:15}

.sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .4s cubic-bezier(.32,.72,0,1);z-index:21}

.grab{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 6px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shead b{font-size:17px}
.sp{width:56px}
.sbig{text-align:center;font-size:40px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.scap{text-align:center;font-size:14px;color:var(--sub);margin:4px 0 18px}
#busy{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.72);color:#000;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 2px 14px rgba(0,0,0,.15);z-index:30}

#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.loginbox{width:100%;max-width:340px;text-align:center}
.loginbox h2{margin:0 0 4px;font-size:28px}
.appico{width:72px;height:72px;border-radius:18px;margin:0 auto 14px;background:linear-gradient(135deg,#34c759,#30b0c7);color:#fff;font-size:36px;font-weight:700;display:flex;align-items:center;justify-content:center}
.field{display:block;width:100%;background:var(--card);border-radius:12px;padding:14px;margin:16px 0 12px;text-align:center}
details summary{font-size:15px;font-weight:600;cursor:pointer}
pre{white-space:pre-wrap;font-size:13px;margin:10px 0 0;font-family:inherit;color:var(--sub)}
.xbtn{flex:none;border:0;background:var(--fill);color:var(--sub);width:26px;height:26px;border-radius:50%;font-size:14px;line-height:26px;text-align:center;padding:0;cursor:pointer;margin-top:1px}
.wday{border-top:.5px solid var(--sep);padding:9px 0}

.fbadge{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.fb-k{background:var(--green);color:#fff}.fb-m{background:var(--fill);color:var(--sub)}

#dlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</div></div>

</div>

<script>
var API='https://script.google.com/macros/s/AKfycbwomkqdkTHYXHHL0aWNmfkm8TTSIx-Idm8lSG09fNMV9DlONcfVILu8-yhx5RZWXQMrhg/exec';
var K=new URLSearchParams(location.search).get('k')||'';
var D=null,TAB='home',HIS=[],RING=163.4,AM=[],TD=[],REPS=null,BUD=null;
var PAL=['var(--orange)','var(--blue)','var(--green)','var(--pink)','var(--purple)','var(--teal)','var(--red)'];
var COL={red:'var(--red)',orange:'var(--orange)',blue:'var(--blue)',purple:'var(--purple)',green:'var(--green)'};
function $(id){return document.getElementById(id);}
function save(k){try{localStorage.setItem('yk',k);}catch(x){}}
function saved(){try{return localStorage.getItem('yk')||'';}catch(x){return '';}}
function busy(on){$('busy').style.display=on?'block':'none';}
function call(fn,args,ok,ng){
  busy(true);
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){return r.json();})
    .then(function(j){busy(false);if(!j.ok){if(ng)ng();err(j.error);return;}ok(j.data);})
    .catch(function(e){busy(false);if(ng)ng();err('通信できませんでした（'+e+'）');});
}
function askKey(msg){closeSheet();$('main').style.display='none';$('login').style.display='flex';if(msg)alert(msg);}
function login(){K=$('pw').value.trim();if(!K)return;$('login').style.display='none';$('main').style.display='block';load();}
function start(){
  $('date').textContent=new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
  tab('home');
  if(!K)K=saved();if(!K){askKey('');return;}load();
}
function load(){
  try{var c=localStorage.getItem('ykd');if(c&&!D)show(JSON.parse(c));}catch(x){}
  call('apiData',[K],function(j){save(K);try{localStorage.setItem('ykd',JSON.stringify(j));}catch(x){}show(j);});
}
function err(e){
  var m=String((e&&e.message)||e);
  if(m.indexOf('合言葉が違います')>=0){try{localStorage.removeItem('yk');}catch(x){}K='';askKey('合言葉が違います。もう一度入れてください');return;}
  alert('エラー：'+m);
}
function yen(n){return Math.round(n||0).toLocaleString('ja-JP')+'円';}
function num(n){return Math.round(n||0).toLocaleString('ja-JP')+'<span class="u">円</span>';}
function pct(x){return Math.round((x||0)*100);}
function sgn(n){return n>0?'▲':(n<0?'▼':'±');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function opts(list,v){return (list||[]).map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>';}).join('');}
function head(color,icon,title,right){return '<div class="chead"><span class="ico" style="background:'+color+'">'+icon+'</span><span class="ct" style="color:'+color+'">'+title+'</span>'+(right?'<span class="cr">'+right+'</span>':'')+'</div>';}

function tab(t){
  TAB=t;
  ['home','rec','ask','rep'].forEach(function(x){$('tab-'+x).style.display=x===t?'':'none';$('tb-'+x).className=x===t?'on':'';});
  $('ttl').textContent={home:'やりくり',rec:'記録',ask:'相談',rep:'レポート'}[t];

}
function goAdd(){tab('rec');seg(0);setTimeout(function(){$('camt').focus();},150);}

/* ---- ホーム ---- */
function tipHTML(){
  var T=D.ひとこと,when='';
  if(T&&T.時刻)when=(T.古い&&T.日?T.日.slice(5).replace('-','/')+' ':'')+T.時刻+' 更新';
  var h='<div class="chead"><span class="ico aigrad">✦</span><span class="ct">プランナーのひとこと</span><span class="cr">'+esc(when)+'</span></div>';

  else h+='<div class="rs">'+(T&&T.エラー?'AIに接続できませんでした：'+esc(T.エラー):'まだありません')+'</div>';
  return h+'<button class="txtbtn" onclick="advice()">今の数字で言い直してもらう</button>';
}
function advice(){call('apiAdvice',[K],show);}
function insKey(x){return String(x.題)+'|'+String(x.文);}
function insHidden(){try{return JSON.parse(localStorage.getItem('ykins')||'[]');}catch(e){return [];}}
function insSetHidden(a){try{localStorage.setItem('ykins',JSON.stringify(a.slice(-100)));}catch(e){}}
function insHTML(){
  var all=D.気づき||[],hid=insHidden();
  var L=[],n=0;
  all.forEach(function(x,i){if(hid.indexOf(insKey(x))<0)L.push(i);else n++;});
  var h=head('var(--orange)','!','気づき',L.length?L.length+'件':'');
  var back=n?'<button class="txtbtn" onclick="insRestore()">確認済みの気づきを戻す（'+n+'件）</button>':'';
  if(!L.length)return h+'<div class="rs">'+(n?'すべて確認済みです':'今のところ気になる点はありません')+'</div>'+back;
  h+='<div class="list ins">';
  L.forEach(function(i){
    var x=all[i];
    var on=x.タブ?' tap" onclick="tab(\''+x.タブ+'\')"':'"';
    h+='<div class="row'+on+'><span class="dot" style="background:'+(COL[x.色]||'var(--sub)')+'"></span><div class="grow"><div class="rt2">'+esc(x.題)+'</div><div class="rs">'+esc(x.文)+'</div></div>'+
      '<button class="xbtn" aria-label="確認したので消す" onclick="event.stopPropagation();insDone('+i+')">✕</button></div>';
  });
  return h+'</div>'+back;
}
function insDone(i){
  var x=(D.気づき||[])[i];if(!x)return;
  var hid=insHidden(),k=insKey(x);if(hid.indexOf(k)<0)hid.push(k);
  insSetHidden(hid);$('ins').innerHTML=insHTML();
}
function insRestore(){
  var now=(D.気づき||[]).map(insKey);
  insSetHidden(insHidden().filter(function(k){return now.indexOf(k)<0;}));
  $('ins').innerHTML=insHTML();
}
function weekHTML(){
  var W=D.今週;
  var h=head('var(--teal)','7','今週のやりくり',W?esc(W.期間):'');
  if(!W)return h+'<div class="rs">読み込み中…</div>';
  var diff=W.使った-W.目安今日まで;
  h+='<div class="v">'+num(W.使った)+'</div>';
  h+='<div class="rs">月曜〜今日（'+W.経過+'日間）・'+W.件数+'件　1週間の目安 '+yen(W.目安週)+'</div>';
  var ok=diff<=0;
  h+='<span class="pill bg'+(ok?'順調':(diff<=W.目安1日?'注意':'ピンチ'))+'" style="margin-top:8px">'+
    (ok?'目安どおり・今日までの目安より '+yen(-diff)+' 少ない':'目安より '+yen(diff)+' 多い')+'</span>';
  var mx=Math.max(W.目安1日,1);W.日別.forEach(function(d){if(d.合計>mx)mx=d.合計;});

  W.日別.forEach(function(d){
    var over=d.合計>W.目安1日;
    var bar='<span class="cbar"><i style="width:'+(d.合計?Math.max(3,d.合計/mx*100):0)+'%;background:'+(over?'var(--red)':'var(--teal)')+'"></i></span>';
    var lab='<span class="d'+(d.今日?' today':'')+(d.未来?' fut':'')+'">'+esc(d.日)+'</span>';
    var am='<span class="amt'+(over?' up':'')+(d.未来?' fut':'')+'">'+(d.未来&&!d.合計?'－':yen(d.合計))+'</span>';
    if(d.明細.length){
      h+='<details class="wday"'+(d.今日?' open':'')+'><summary>'+lab+bar+am+'</summary><div class="mx">'+
        d.明細.map(function(t){return '<div class="top"><span>'+esc(t.時刻)+' '+esc(t.名前)+' <span class="tiny">'+esc(t.カテゴリ)+'</span></span><span>'+yen(t.金額)+'</span></div>';}).join('')+'</div></details>';
    }else{
      h+='<div class="wday"><div style="display:flex;align-items:center;gap:10px">'+lab+bar+am+'</div></div>';
    }
  });
  h+='</div><div class="tiny" style="margin-top:4px">青い日付＝今日。赤いバー＝1日の目安 '+yen(W.目安1日)+' を超えた日。日付をタップすると明細が開きます</div>';
  var P=W.先月,rows=[];
  rows.push(['計算の目安（今日まで）',yen(W.目安今日まで)]);
  if(P&&P.あり){
    var c=W.使った-P.同時期;
    rows.push(['先月の同じ週・同じ曜日まで<div class="tiny">'+esc(P.期間)+'</div>',yen(P.同時期)]);
    rows.push(['　→ 先月とくらべて','<span class="'+(c>0?'up':'down')+'">'+sgn(c)+yen(Math.abs(c))+'</span>']);
    rows.push(['先月の1週間あたり（平均）',yen(P.週平均)]);
  }
  h+='<div class="wcmp">'+rows.map(function(r){return '<span>'+r[0]+'</span><b>'+r[1]+'</b>';}).join('')+'</div>';
  return h+'<div class="tiny" style="margin-top:6px">やりくり費の支出だけを集計（固定費・特別費は入れていません）。目安＝今月のやりくり費÷今月の日数</div>';
}
function bankHTML(){
  var S=D.貯蓄;
  var h=head('var(--blue)','¥','口座の残高');
  h+='<div class="duo"><div><div class="k">共有口座</div><div class="v">'+num(D.実残高)+'</div></div>';
  if(S&&S.残高!==null&&S.残高!==undefined){
    h+='<div><div class="k">貯蓄口座</div><div class="v">'+num(S.残高)+'</div></div></div>';
  }else{
    h+='<div><div class="k">貯蓄口座</div><div class="v" style="font-size:17px;color:var(--sub)">未入力</div></div></div>';
  }
  var more='';
  if(S&&S.確認日)more+='<div class="rs">貯蓄口座は '+esc(S.確認日)+' の残高＋出入りで計算</div>';

  if(S&&S.最近&&S.最近.length){
    more+='<div class="rs" style="margin-top:6px">最近の動き<br>'+S.最近.map(function(x){
      var z=x.種類==='残高'?'残高 '+yen(x.金額):x.種類+' '+(x.種類==='出金'?'−':'＋')+yen(Math.abs(x.金額));
      return esc(x.日+' '+z+' '+x.内容);
    }).join('<br>')+'</div>';
  }
  more+='<button class="txtbtn" onclick="setSave()">貯蓄口座の残高を入力</button>';
  return h+'<details style="margin-top:8px"><summary class="rs" style="font-weight:600">くわしく</summary>'+more+'</details>';
}


/* ---- レポートタブ ---- */
function catHTML(A){
  if(!A)return '';
  var y=A.やりくり,M=D.目安||{};
  var h=head('var(--orange)','▦','カテゴリ別',esc(D.月)+' 1日〜今日');
  h+='<div class="v">'+num(y.今月)+'</div><div class="rs">やりくり合計'+(A.先月あり?'　先月の同じ時期（1〜'+A.今日+'日）より <span class="'+(y.差>0?'up':'down')+'">'+sgn(y.差)+yen(Math.abs(y.差))+'</span>':'')+'</div>';

    h+='<div class="crow"><div class="top"><span>'+esc(c.名前)+'</span><b'+(over?' class="up"':'')+'>'+yen(c.今月)+(m?'<span style="font-weight:400;color:var(--sub);font-size:13px"> / '+yen(m)+'</span>':'')+'</b></div>'+
      '<div class="cbar"><i style="width:'+Math.max(2,w)+'%;background:'+(over?'var(--red)':PAL[i%PAL.length])+'"></i></div>'+
      (m?'<div class="rs'+(over?' up':'')+'">'+(over?'目安を '+yen(c.今月-m)+' オーバー':'目安まで あと '+yen(m-c.今月))+'</div>':'')+
      (d?'<div class="rs '+(c.差>0?'up':'down')+'">先月比 '+d+'</div>':'')+'</div>';
  });
  Object.keys(M).forEach(function(n){
    if(!A.カテゴリ.some(function(c){return c.名前===n;}))
      h+='<div class="crow"><div class="top"><span>'+esc(n)+'</span><b>0円<span style="font-weight:400;color:var(--sub);font-size:13px"> / '+yen(M[n])+'</span></b></div><div class="cbar"><i style="width:2%;background:var(--green)"></i></div></div>';
  });
  h+='</div>';
  var n=[];
  if(A.先月あり)n.push('先月は1か月で '+yen(A.先月全体)+' でした');
  if(A.特別費)

  n.push('特別費 '+yen(A.特別費)+'（やりくりには入れていません）');
  if(n.length)h+='<div class="note">'+n.map(esc).join('<br>')+'</div>';
  return h;
}
function budHTML(){
  var M=D.目安||{},ks=Object.keys(M),sum=0;ks.forEach(function(c){sum+=M[c];});

function fixHTML(F){

  var h=head('var(--pink)','≡','今月の固定費');
  var b=['支払い済み '+yen(F.済み),'これから '+yen(F.これから)];

  var M={'済み':'✓','これから':'・','取り置き':'◇','通知待ち':'…','今月はなし':'－'};

  h+='<div class="list" style="margin-top:8px">';

function nmHTML(){

  h+='<div class="rs">やりくり費を1円も使わなかった日（固定費・特別費は数えません）'+(N.先月達成!=null?'<br>先月（'+esc(N.先月名)+'）は '+N.先月達成+'日'+(N.達成>N.先月達成?'　→ もう先月超え！':(N.達成===N.先月達成?'　→ 先月と同じ':'　→ 先月まであと'+(N.先月達成-N.達成)+'日')):'')+'</div>';
  h+='<div class="nmcal">';
  ['月','火','水','木','金','土','日'].forEach(function(w){h+='<div class="nw">'+w+'</div>';});
  var off=(N.初日曜+6)%7;
  for(var k=0;k<off;k++)h+='<div></div>';
  var kk=function(v){return v>=1000?Math.round(v/100)/10+'k':String(v);};
  N.日別.forEach(function(v,i){

    else if(d===N.今日){cls+=' ntoday';sub='<i>'+(v===0?'今日':kk(v))+'</i>';}
    else if(v===0){cls+=' nok';sub='<i>✓</i>';}

var DLGCB=null;
function dlgOpen(t,n,input,okText,cancelText,cb){
  $('dlgT').textContent=t;$('dlgN').textContent=n||'';$('dlgN').style.display=n?'':'none';
  var I=$('dlgI');
  if(input){I.style.display='';I.type=input.type||'text';I.inputMode=input.type==='number'?'numeric':'text';I.value=input.value==null?'':input.value;I.placeholder=input.ph||'';}
  else I.style.display='none';
  $('dlgO').textContent=okText||'OK';$('dlgC').textContent=cancelText||'キャンセル';
  DLGCB=cb;
  $('dlgO').onclick=function(){var f=DLGCB;dlgClose();f&&f(input?I.value:true);};
  $('dlgC').onclick=function(){var f=DLGCB;dlgClose();if(!input&&f)f(false);};
  I.onkeydown=function(e){if(e.key==='Enter'&&!e.isComposing)$('dlgO').onclick();};
  $('dlg').classList.add('on');
  if(input)setTimeout(function(){I.focus();try{I.select();}catch(x){}},50);
}
function dlgClose(){$('dlg').classList.remove('on');DLGCB=null;}
function inputBox(t,n,v,type,cb){dlgOpen(t,n,{value:v,type:type},'保存','キャンセル',cb);}

  $('aq').value='';

  $('qa').insertAdjacentHTML('beforeend','<div class="q">'+esc(q)+'</div><div class="a" id="thinking">考え中…</div>');
  call('apiAsk',[K,q,HIS],function(a){
    var t=$('thinking');t.removeAttribute('id');t.innerHTML=esc(a).replace(/\n/g,'<br>');

function pickReceipt(inp){
  var f=inp.files&&inp.files[0];inp.value='';if(!f||!D)return;
  var img=new Image(),url=URL.createObjectURL(f);
  img.onload=function(){
    var s=Math.min(1,1600/Math.max(img.width,img.height));
    var c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    var b64=c.toDataURL('image/jpeg',0.8).split(',')[1];
    aimsg('レシートを読んでいます…（10〜30秒）');
    call('apiReceipt',[K,b64,'image/jpeg',D.cats],function(j){showReceipt(JSON.parse(j));},function(){$('aires').innerHTML='';});
  };
  img.onerror=function(){alert('写真を開けませんでした');};
  img.src=url;
}
function showReceipt(R){
  if(!R.読めた){aimsg('レシートを読み取れませんでした。明るい場所で、レシート全体が入るように撮り直してください。');return;}
  var h='<div class="k" style="margin-top:12px">読み取り結果（まちがいは直せます）</div><div class="list">'+
    '<label class="row"><span class="lk">金額</span><input id="ramt" class="fin" type="number" inputmode="numeric" value="'+esc(R.合計)+'"></label>'+
    '<label class="row"><span class="lk">お店</span><input id="rname" class="fin" value="'+esc(R.店舗)+'"></label>'+
    '<label class="row"><span class="lk">カテゴリ</span><select id="rcat">'+opts(D.cats,R.カテゴリ)+'</select></label>'+
    '<label class="row"><span class="lk">何を</span><input id="ritem" class="fin" value="'+esc(R.品目)+'"></label></div>';
  if(R.日付)h+='<div class="rs">レシートの日付：'+esc(R.日付)+'（現金で記録すると、今日の日付になります）</div>';
  var M=(D.取引||[]).map(function(t,i){return {t:t,i:i};}).filter(function(x){return Number(x.t.金額)===Number(R.合計)&&x.t.区分!=='調整';}).slice(0,3);
  if(M.length){
    h+='<div class="rs" style="margin-top:10px">カードで払った場合は、すでにある取引に品目だけをつけてください（二重記録を防ぐため）</div>';
    M.forEach(function(x){h+='<button class="ghost" onclick="attach('+x.i+')">「'+esc(x.t.メモ||x.t.店舗)+'　'+esc(x.t.日)+'」に品目をつける</button>';});
  }
  h+='<button class="primary" onclick="receiptSave()">現金の支出として記録する</button>';
  $('aires').innerHTML=h;
}
function attach(i){
  var t=D.取引[i],it=$('ritem').value.trim();
  if(!it){alert('何を買ったかを入れてください');return;}
  call('apiItems',[K,D.ym,[{id:t.id,品目:it}]],function(j){show(j);aimsg('品目をつけました');});
}
function receiptSave(){
  var a=$('ramt').value,n=$('rname').value.trim(),c=$('rcat').value,it=$('ritem').value.trim();
  if(!(Number(a)>0)||!n){alert('金額とお店を入れてください');return;}
  var old={};(D.取引||[]).forEach(function(t){old[t.id]=1;});
  call('apiCash',[K,a,n,c],function(j){
    show(j);aimsg('記録しました');
    var nw=(D.取引||[]).filter(function(t){return !old[t.id]&&Number(t.金額)===Number(a);})[0];
    if(it&&nw)call('apiItems',[K,D.ym,[{id:nw.id,品目:it}]],show);
  });
}
function amazon(){
  aimsg('Amazonの注文メールを読んでいます…（30秒ほど）');
  call('apiAmazon',[K],function(j){
    var R=JSON.parse(j);AM=R.案||[];
    if(!AM.length){aimsg(esc(R.メッセージ||'案はありません'));return;}
    var h='<div class="k" style="margin-top:12px">AIの案（チェックしたものだけ反映）</div><div class="list">';
    AM.forEach(function(x,i){
      h+='<label class="row"><input type="checkbox" class="cb" id="am'+i+'"'+(x.確信==='低'?'':' checked')+'><div class="grow"><div class="rt2">'+esc(x.品目)+'</div><div class="rs">'+esc(x.名前)+'・'+esc(x.日)+'・'+yen(x.金額)+(x.確信==='低'?'・自信なし':'')+'</div></div></label>';
    });
    $('aires').innerHTML=h+'</div><button class="primary" onclick="amazonApply()">チェックしたものを反映</button>';
  },function(){$('aires').innerHTML='';});
}
function amazonApply(){
  var L=AM.filter(function(x,i){return $('am'+i).checked;}).map(function(x){return {id:x.id,品目:x.品目};});
  if(!L.length){alert('チェックがありません');return;}
  call('apiItems',[K,D.ym,L],function(j){show(j);aimsg(L.length+'件に品目をつけました');});
}
function tidy(){
  aimsg('AIが未確定のお店を整理しています…');
  call('apiTidy',[K],function(j){
    var R=JSON.parse(j);TD=R.案||[];
    if(!TD.length){aimsg(esc(R.メッセージ||'案はありません'));return;}
    var h='<div class="k" style="margin-top:12px">AIの案（チェックしたものだけ反映）</div><div class="list">';
    TD.forEach(function(x,i){
      h+='<label class="row"><input type="checkbox" class="cb" id="td'+i+'"'+(x.確信==='低'?'':' checked')+'><div class="grow"><div class="rt2">'+esc(x.名前)+'　<span style="font-weight:400;color:var(--sub);font-size:13px">'+esc(x.カテゴリ)+'</span></div><div class="tiny">明細：'+esc(x.明細)+'</div><div class="rs">'+esc(x.日)+'・'+yen(x.金額)+(x.確信==='低'?'・自信なし':'')+'</div></div></label>';
    });
    $('aires').innerHTML=h+'</div><button class="primary" onclick="tidyApply()">チェックしたものを反映</button>';
  },function(){$('aires').innerHTML='';});
}
function tidyApply(){
  var L=TD.filter(function(x,i){return $('td'+i).checked;}).map(function(x){return {id:x.id,名前:x.名前,カテゴリ:x.カテゴリ};});
  if(!L.length){alert('チェックがありません');return;}
  aimsg('反映しています…（'+L.length+'件。少し時間がかかります）');
  call('apiTidyApply',[K,D.ym,L],function(j){show(j);aimsg(L.length+'件を反映しました');});
}
start();
</script></body></html>
